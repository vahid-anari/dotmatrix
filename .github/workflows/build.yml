# Builds the Android app and the firmware, and makes releases.
#
# - Every push to main: both are built and tested; download them from the
#   run's Artifacts.
# - A release (tag vX.Y.Z, with the APK and firmware attached, which the app
#   offers as an update) is made by itself when a push to main raises the
#   version in app/pyproject.toml: there is no tag vX.Y.Z yet, so this run
#   creates it. To release, raise the version (and APP_VERSION), add its
#   "## X.Y.Z — date" section to CHANGELOG.md (the release's text) and push.
# - Pushing a tag by hand (git tag v0.4.0 && git push origin v0.4.0) still
#   works too.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create releases and their tags

# One run at a time per branch, so two quick pushes can't both release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Version, and is this a release?
        id: ver
        run: |
          v=$(grep -m1 '^version' app/pyproject.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF#refs/tags/v}" = "$v" ] || { echo "::error::Tag ${GITHUB_REF#refs/tags/} but app/pyproject.toml says $v"; exit 1; }
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            release=true   # a new version on main
          else
            release=false
          fi
          if [ "$release" = true ] && ! grep -q "^## $v " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## $v'"; exit 1
          fi
          grep -q "^APP_VERSION = \"$v\"" app/src/ui/app.py || { echo "::error::APP_VERSION in app/src/ui/app.py is not $v (app/pyproject.toml)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v, release: $release" >> "$GITHUB_STEP_SUMMARY"

  app:
    name: Android app
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet[all]==1.0.4"

      # Android only installs an update over an app signed with the same key, so
      # every build must use one fixed key, kept in the repo's secrets (see
      # app/README.md, "Signing key"). Without it the APK still builds, but with a
      # throwaway key, so it won't install over an earlier version.
      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dotmatrix.jks"
            echo "path=$RUNNER_TEMP/dotmatrix.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK won't install over an earlier version."
          fi

      # arm64 only: every Android phone from the last ~8 years.
      - name: Build APK
        working-directory: app
        env:
          KEY_PATH: ${{ steps.sign.outputs.path }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEY_PATH" ]; then
            signing=(--android-signing-key-store "$KEY_PATH"
                     --android-signing-key-store-password "$KEY_STORE_PASSWORD"
                     --android-signing-key-alias "${KEY_ALIAS:-dotmatrix}"
                     --android-signing-key-password "${KEY_PASSWORD:-$KEY_STORE_PASSWORD}")
          fi
          flet build apk --yes --no-rich-output --skip-flutter-doctor \
            --arch arm64-v8a \
            --build-version "${{ needs.version.outputs.version }}" \
            --build-number "${{ github.run_number }}" \
            "${signing[@]}"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/apk/*.apk "dist/dotmatrix-${{ needs.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dotmatrix-apk
          path: dist/*.apk

  firmware:
    name: Firmware
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # A release says its version; other builds say which commit they are.
      - name: Firmware version
        id: ver
        run: |
          if [ "${{ needs.version.outputs.release }}" = true ]; then
            echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The app compares this with the latest release to offer updates.
      - name: Build
        working-directory: firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run

      - name: Host tests
        working-directory: firmware
        run: ARDUINOJSON=.pio/libdeps/esp32c3/ArduinoJson/src ./test_host/run.sh

      - name: Collect
        run: |
          mkdir -p dist
          cp firmware/.pio/build/esp32c3/firmware.bin dist/dotmatrix-firmware.bin
          cp firmware/.pio/build/esp32c3/firmware.factory.bin dist/dotmatrix-firmware-full.bin

      - uses: actions/upload-artifact@v4
        with:
          name: dotmatrix-firmware
          path: dist/*.bin

  app-tests:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet==1.0.4" "websockets>=13,<18" pytest
      - working-directory: app
        run: python -m pytest -q

  release:
    name: Release
    if: needs.version.outputs.release == 'true'
    needs: [version, app, firmware, app-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src

      # The release's text: this version's section of CHANGELOG.md.
      - name: Notes
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' src/CHANGELOG.md > notes.md
          cat notes.md

      # Creates the tag vX.Y.Z on this commit if it isn't there yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dot Matrix ${{ needs.version.outputs.version }}
          files: dist/*
          body_path: notes.md
