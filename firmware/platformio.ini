; Dot Matrix Display firmware — ESP32-C3 + 8 × MAX7219 (FC-16)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32c3]
; pioarduino = Arduino core 3.x for PlatformIO (55.03.312 → Arduino core 3.3.12)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; 1.9 MB app slots (room for OTA) + 190 KB LittleFS
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1      ; Serial over the C3's native USB
  -D CORE_DEBUG_LEVEL=0

; Pinned release archives straight from GitHub (the exact versions this code is
; tested with; the PlatformIO registry lags behind for some of them).
lib_deps =
  MD_Parola=https://github.com/MajicDesigns/MD_Parola/archive/refs/tags/v3.7.7.zip
  MD_MAX72XX=https://github.com/MajicDesigns/MD_MAX72XX/archive/refs/tags/v3.5.1.zip
  ArduinoJson=https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v7.4.3.zip
  ESPAsyncWebServer=https://github.com/ESP32Async/ESPAsyncWebServer/archive/refs/tags/v3.12.1.zip
  AsyncTCP=https://github.com/ESP32Async/AsyncTCP/archive/refs/tags/v3.5.0.zip
